# Configuration du centre de contrôle — MODÈLE À COPIER.
#
#     cp control-center/control-center.example.toml control-center/control-center.toml
#
# ⚠️ Ce fichier-ci est le MODÈLE du template : il est remplacé à chaque
# synchronisation. Votre configuration vit dans `control-center.toml`, à côté,
# et n'est JAMAIS touchée par `tools/update_kit.sh` : elle est absente de
# l'arbre du kit, et `git checkout` ne restaure que ce qu'il connaît (ADR-0007).
#
# Principe : tout ce qui peut être découvert l'est. La liste des agents vient de
# `.claude/agents/`, celle des specs du système de fichiers, les fichiers
# modifiés de git. Ce fichier ne porte QUE ce qu'aucune inspection ne donne.
#
# Tout est optionnel : sans `control-center.toml`, l'outil démarre sur ses
# défauts. Un projet qui n'a rien de particulier à déclarer n'a rien à écrire.

[projet]
nom = "Mon projet"

[specs]
# Racine des spécifications, relative à la racine du dépôt.
racine = "specs/features"

# ⚠️ LE KANBAN TIRE SES COLONNES DU RÉPERTOIRE, jamais du champ « Statut » des
# fichiers. Ce n'est pas de la facilité : sur le dépôt d'origine, ce champ était
# en texte libre — plus de vingt formes distinctes, parfois une phrase sur
# plusieurs lignes — et contredisait le répertoire 22 fois sur 165 specs.
#
# Le statut reste AFFICHÉ tel quel, et la divergence est signalée. Un répertoire
# est vérifiable mécaniquement ; une phrase écrite à la main ne l'est pas.
#
# L'ordre fait le Kanban, le libellé rend la colonne lisible. Ni l'un ni l'autre
# ne se devine : « doing » ne dit pas si le travail avance ou s'il est bloqué.
[[specs.colonnes]]
repertoire = "todo"
libelle = "À faire"

[[specs.colonnes]]
repertoire = "doing"
libelle = "En cours"

[[specs.colonnes]]
repertoire = "done"
libelle = "Clos"

# ⚠️ Choisir « Clos » plutôt que « Terminé » n'est pas cosmétique. Le dernier
# répertoire archive souvent aussi des décisions de NE PAS faire, et des specs
# dont des vérifications restent à jouer. Le cycle peut de surcroît être
# RÉVERSIBLE — une spec peut en ressortir. Aucune colonne n'est terminale.

# Vocabulaire AJOUTÉ aux défauts (la fusion complète, elle n'efface pas).
# Les défauts couvrent todo/draft/doing/wip/done/livré/clôturé/terminé/abandonné.
# Déclarez ici les formes propres à votre projet.
#
# [specs.vocabulaire]
# gelee = "done"     # une spec « GELÉE » est-elle close chez vous, ou en attente ?

[agents]
# Découverts, jamais listés : le répertoire fait foi.
racine = ".claude/agents"

[commandes]
# ⚠️ LISTE FERMÉE des commandes que le serveur acceptera de lancer. L'interface
# choisit une CLÉ ; elle ne fournit jamais une ligne de commande. Aucune chaîne
# venue du réseau ne peut donc atteindre un shell.
#
# Chaque valeur est un `argv`, jamais une chaîne : `["ls", "-l"]`, pas `"ls -l"`.
# Une chaîne serait refusée — ce serait précisément une ligne de commande.
#
# tests = ["pytest", "-q"]
# build = ["make"]
# lint  = ["./tools/lint.sh"]

[workflows]
# ⚠️ Bloc COMMENTÉ ET VIDE par défaut : sans lui, un workflow affiché reste
# une SESSION entière (comportement d'avant bug-004). Un cycle mené sans ces
# agents sera rattaché au précédent — le découpage ne se fait jamais au jugé,
# seulement sur les agents que vous déclarez ici.
#
# Les agent_type dont l'invocation ouvre un nouveau cycle dans le tableau de
# bord (typiquement celui qui prépare le plan avant tout le reste) :
# agents_ouvrants = ["orchestrator"]

# Nombre de workflows envoyés au tableau de bord, borné [1, 100] :
# affiches = 20

[serveur]
# ADR-0020 — Un centre de contrôle appartient à UN développeur. Il pilote une
# session Claude liée à SON compte ; où il tourne (portable, conteneur,
# machine distante) est un choix de déploiement, jamais un changement de
# nature. Le jeton en découle :
#
#   - écoute sur 127.0.0.1 (ou localhost/::1) → le jeton est FACULTATIF :
#     qui atteint le port a déjà un shell sur la machine, lecture ET écriture
#     fonctionnent sans secret ;
#   - écoute au-delà → le jeton est OBLIGATOIRE, LECTURE COMPRISE. C'est lui,
#     et lui seul, qui rattache « qui frappe à la porte » à « celui à qui ce
#     serveur appartient ».
#
# ⚠️ Tout intermédiaire LOCAL — reverse proxy, terminaison TLS, `socat`,
# userland-proxy Docker — fait arriver les requêtes du réseau en 127.0.0.1 :
# la détection ne les voit pas passer par ailleurs. Dans ce cas, déclarez un
# `fichier_jeton` : un jeton CONFIGURÉ reste vérifié même en local, et c'est
# lui qui vous protège.
#
# 127.0.0.1 par défaut. Ouvrir au réseau local est une décision EXPLICITE :
# hote = "0.0.0.0"
hote = "127.0.0.1"
port = 8787

# Secret exigé sur TOUTE route dès que la requête est distante (voir ADR-0020
# ci-dessus), dans un fichier HORS DÉPÔT, mode 600. Cette clé est LUE à chaque
# requête (backend/jeton.py) : sans elle, ou si le fichier est mal protégé,
# toute requête distante — lecture comme écriture — est refusée (401) ; la
# machine locale, elle, continue de fonctionner sans jeton.
#
# Génération recommandée :
#   python3 -c "import secrets; print(secrets.token_hex(32))" > /chemin/hors/depot/.control-center-token
#   chmod 600 /chemin/hors/depot/.control-center-token
#
# Un retour à la ligne final (ce que laisse un `echo secret > fichier`) est
# toléré et retiré. Une ESPACE dans le jeton, ou un jeton de moins de 16
# octets utiles, sont REFUSÉS — le serveur démarre alors en écriture
# désactivée plutôt que de croire protégé un secret trop faible ou ambigu.
# fichier_jeton = "/chemin/hors/depot/.control-center-token"

[garde_fous]
# Un clic dans une interface ne doit jamais déclencher une dépense non bornée.
# Cette valeur est LUE et RÉELLEMENT TRANSMISE (`--max-budget-usd`) au processus
# lancé par POST /api/lancer — mais seulement pour les clés listées ci-dessous
# dans `commandes_avec_budget` : une clé absente de cette liste refuse le
# lancement (503) plutôt que de partir sans plafond.
budget_max_usd = 5.0

# Liste FERMÉE des clés de [commandes] autorisées à recevoir le plafond ci-dessus.
# Vide par défaut : déclarer une commande ici est une décision explicite du
# projet, jamais un héritage silencieux.
#
# commandes_avec_budget = ["tests"]

# Un seul workflow ÉCRIVAIN à la fois : deux sessions qui écrivent dans le même
# arbre s'entrelacent selon l'ordre des vidages. Le second lancement est refusé
# avec sa raison (409), jamais mis en file en silence. Cette valeur est LUE par
# backend/verrou.py (un fichier de verrou par écrivain autorisé).
ecrivains_simultanes = 1

# [session] — la session Claude remote PERSISTANTE que le cockpit parle
# (feature-026), déjà authentifiée, déjà pilotée depuis un autre terminal
# (téléphone, `tmux attach`). Le cockpit ne lance RIEN ici : il lit le
# transcript de cette session et tape dans son pty via `tmux`.
#
# ⚠️ JAMAIS un champ de requête : si le porteur du jeton pouvait le choisir,
# il choisirait dans quel terminal il tape. Bloc COMMENTÉ ET VIDE par
# défaut — sans lui, `/api/conversation` retombe sur l'ancien canal
# `json-lines` (feature-022), inchangé.
#
# [session]
# Chemin ABSOLU du socket tmux (jamais dérivé de TMUX/TMUX_TMPDIR/TMUX_PANE
# hérités de l'environnement — c'est le couplage accidentel qui a fait
# fonctionner ce module « par erreur » avant que ce réglage n'existe) :
# socket_tmux = "/run/tmux-kit/tmux-0/default"
#
# Nom de la session tmux à l'intérieur de ce socket :
# nom = "claude-kit"
#
# Répertoire ABSOLU où vivent les transcripts (`<session-id>.jsonl`) de
# CETTE session — typiquement sous `~/.claude/projects/<projet encodé>/` :
# repertoire_transcripts = "/root/.claude/projects/-root-agent-kit"
