# ============================================================================
# Contrôles d'hygiène documentaire — variante GitLab.
#
# ⚠️ Ce fichier N'EST PAS un pipeline complet : il n'ajoute que cinq jobs,
# pour pouvoir cohabiter avec une chaîne de build et de déploiement existante.
#
# Deux façons de le brancher :
#
#   A. Depuis le .gitlab-ci.yml du projet :
#          include:
#            - local: '.gitlab/ci/hygiene.yml'
#      puis ajouter `hygiene` à la liste des `stages` du pipeline principal.
#
#   B. Copier les cinq jobs directement dans le .gitlab-ci.yml existant.
#
# Ne JAMAIS remplacer un .gitlab-ci.yml existant par ce fichier.
#
# POURQUOI CES CONTRÔLES
# ----------------------
# 1. Unicité des specs : le cycle todo -> doing -> done procède par DÉPLACEMENT.
#    Une spec copiée, ce sont deux versions qui divergent et deux statuts qui se
#    contredisent — « où en est cette feature ? » n'a plus de réponse lisible.
# 2. Liens de documentation : le chemin d'un lien vers une spec ENCODE son état
#    (`doing/`, `done/`). Chaque promotion casse silencieusement les liens qui
#    citaient l'ancien emplacement.
# 3. Suite de tests (feature-006) : jusqu'ici, aucune CI n'exécutait `tests/` —
#    ni les cas de `test_update_kit.py`, ni ceux de `test_sync_copilot_agents.py`
#    ne tournaient ailleurs qu'à la main, en local.
# 4. Profils GitHub Copilot : parité avec `.github/workflows/hygiene-specs.yml`,
#    qui porte ce contrôle côté GitHub depuis l'origine — un projet GitLab avec
#    Copilot dans l'IDE ne doit pas être moins bien couvert.
# 5. Suite de tests du centre de contrôle (bug-004) : même besoin que le job 3,
#    pour `control-center/` — chemin CONDITIONNEL lui aussi, six fichiers, mais
#    des scripts AUTONOMES (sortie 1 à l'échec) et non des suites `unittest`.
#
# Les jobs 1 et 2 : ni toolchain, ni cache, ni filtre de chemins, quelques
# secondes, sur TOUS les commits — un déplacement de spec n'accompagne pas
# nécessairement une modification de code. Une règle que rien ne vérifie
# n'est pas une règle.
#
# Le job 3 est volontairement SÉPARÉ des deux premiers (base `.tests_base`
# dédiée, pas `.hygiene_base`) : `tests/` exécute réellement `git` et
# `update_kit.sh`, deux dépôts jetables par cas — mesuré le 2026-09-12,
# ~75 ms par cas côté `test_update_kit.py`, et les lots suivants visent
# ~24 cas au total. Ajouter `git`/`python3` à `.hygiene_base` alourdirait
# À TORT les jobs 1 et 2, qui n'en ont jamais eu besoin.
#
# La logique vit dans tools/, pas dans ce YAML : les mêmes scripts tournent en
# local et peuvent servir de hook pre-commit. C'est ce qui rend le support des
# deux forges quasi gratuit.
# ============================================================================

stages:
  - hygiene # à fusionner avec les stages déjà déclarés par le projet

.hygiene_base:
  stage: hygiene
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash grep coreutils findutils
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Base séparée pour la suite de tests (feature-006) : `git` et `python3` n'y
# alourdissent QUE ce job, jamais `.hygiene_base`. Même image alpine que les
# deux premiers jobs, pour ne pas multiplier les couches téléchargées.
.tests_base:
  stage: hygiene
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git python3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

hygiene:specs:
  extends: .hygiene_base
  script:
    - bash ./tools/check_specs.sh

hygiene:liens-doc:
  extends: .hygiene_base
  script:
    - bash ./tools/check_doc_links.sh

hygiene:tests:
  extends: .tests_base
  # Motifs explicites, un par fichier de test DU KIT — jamais une découverte
  # non filtrée. `tests/` est un chemin CONDITIONNEL du kit : un projet
  # consommateur qui l'a déjà reçoit aussi ses propres tests métier dans ce
  # même dossier. `discover -s tests` sans motif les collecterait ici, dans
  # une image qui n'a pas leurs dépendances — nous casserions leur CI par
  # notre faute. Ce job ne teste QUE le kit.
  #
  # ⚠️ Chaque ligne vérifie l'EXISTENCE du fichier avant de lancer
  # `unittest` : ce même YAML descend chez un projet consommateur (chemin
  # conditionnel), qui peut avoir exclu tel fichier via `.kit-paths`. Depuis
  # Python 3.12, `unittest discover` sort en code 5 (« aucun test collecté »)
  # quand le motif ne matche rien — un échec, pas un succès. Un projet qui
  # n'a pas nos tests ne doit pas voir sa CI cassée par nous : d'où le test
  # d'existence, plutôt qu'un `|| true` qui aurait aussi masqué un VRAI
  # échec de test.
  # `if/then/else` explicite, jamais `A && B || echo` : ce dernier masquerait
  # aussi un VRAI échec de B (le `||` se déclenche alors pour la mauvaise
  # raison), exactement ce que ce correctif doit éviter.
  script:
    - |
      if [ -f tests/test_update_kit.py ]; then
        python3 -m unittest discover -s tests -p 'test_update_kit.py'
      else
        echo "ℹ️  tests/test_update_kit.py absent — rien à lancer."
      fi
    - |
      if [ -f tests/test_harnais_kit.py ]; then
        python3 -m unittest discover -s tests -p 'test_harnais_kit.py'
      else
        echo "ℹ️  tests/test_harnais_kit.py absent — rien à lancer."
      fi
    - |
      if [ -f tests/test_sync_copilot_agents.py ]; then
        python3 -m unittest discover -s tests -p 'test_sync_copilot_agents.py'
      else
        echo "ℹ️  tests/test_sync_copilot_agents.py absent — rien à lancer."
      fi

# Job 5 (bug-004, corrigé par bug-019) : suite du centre de contrôle. Même base
# `.tests_base` (git n'y sert à rien mais python3 oui). Même patron que
# `hygiene:tests` ci-dessus : `control-center/` est aussi un chemin CONDITIONNEL
# du kit.
#
# ⚠️ Différence structurante avec `hygiene:tests` : ces fichiers ne sont PAS des
# suites `unittest` — ce sont des scripts AUTONOMES qui sortent en code 1 à
# l'échec. D'où un appel direct `python3 <fichier>`, jamais `unittest discover`
# (qui ne les collecterait pas : ils ne dérivent d'aucun `TestCase`).
#
# ⚠️ La liste est DÉCOUVERTE, jamais énumérée à la main — corrigé par `bug-019`.
# Ce job a énuméré SIX fichiers pendant que le dépôt en comptait VINGT-TROIS :
# les dix-sept manquants incluaient `test_jeton.py` et `test_server_bug012.py`,
# précisément les deux qui échouaient, et `test_agents.py`, que le workflow
# GitHub signale comme déjà oublié une fois par une énumération manuelle. La
# pipeline était donc verte PARCE QU'ELLE NE LANÇAIT PAS ce qui échouait, et
# « la CI est rouge » et « la CI est verte » étaient vraies simultanément sur le
# même commit, selon la forge.
#
# ⚠️ Écrit en POSIX, pas en bash : l'image est `alpine:3.20` et le `script:` de
# GitLab tourne en `sh`. Le `mapfile` employé par le workflow GitHub est une
# primitive bash et ne passerait pas ici. La boucle lit depuis un fichier plutôt
# que depuis un tube, pour qu'un échec reste visible hors du sous-shell.
#
# La découverte ÉCHOUE si elle ne trouve aucun fichier alors que
# `control-center/` existe : une liste vide ne doit jamais se lire comme « tout
# est vert ». Ne pas citer ici de compte de fichiers : il périme aussitôt.
hygiene:centre-de-controle:
  extends: .tests_base
  script:
    - |
      if [ ! -d control-center ]; then
        echo "ℹ️  control-center/ absent — rien à lancer."
        exit 0
      fi

      liste=$(mktemp)
      find control-center -type f -name 'test_*.py' | sort > "$liste"
      nombre=$(wc -l < "$liste" | tr -d ' ')

      if [ "$nombre" -eq 0 ]; then
        echo "❌ control-center/ existe mais aucun fichier test_*.py n'a été découvert." >&2
        echo "   Une liste vide ne doit jamais se lire comme « tout est vert »." >&2
        exit 1
      fi

      echo "Fichiers de test découverts ($nombre) :"
      sed 's/^/  - /' "$liste"
      echo

      echecs=$(mktemp)
      lances=$(mktemp)
      while IFS= read -r fichier; do
        echo "=== $fichier ==="
        # ⚠️ `< /dev/null` : sans lui, `python3` hérite du `stdin` de la boucle,
        # qui EST la liste des fichiers. Un test qui lit `stdin` avale le reste
        # de la liste, les fichiers suivants ne sont jamais lancés, et le job
        # annonce le nombre DÉCOUVERT en concluant « tous verts ».
        # Mesuré pendant la revue de bug-019 : 4 découverts, 2 exécutés,
        # « ✅ 4 fichier(s) … tous verts », code 0. Un faux vert dans le code
        # écrit pour corriger un faux vert.
        python3 "$fichier" < /dev/null || echo "$fichier" >> "$echecs"
        echo "$fichier" >> "$lances"
        echo
      done < "$liste"

      # On compare EXÉCUTÉS à DÉCOUVERTS : annoncer un compte qu'on n'a pas
      # lancé est le défaut que ce job existe pour fermer.
      executes=$(wc -l < "$lances" | tr -d ' ')
      if [ "$executes" -ne "$nombre" ]; then
        echo "❌ $nombre fichier(s) découvert(s) mais $executes exécuté(s)." >&2
        echo "   La boucle a été interrompue — ne jamais lire ce cas comme un succès." >&2
        exit 1
      fi

      if [ -s "$echecs" ]; then
        echo "❌ Fichiers de test en échec :" >&2
        sed 's/^/  - /' "$echecs" >&2
        exit 1
      fi
      echo "✅ $nombre fichier(s) de test découverts, $executes exécuté(s), tous verts."

# Parité avec le job GitHub `agents-copilot` : `python3` seul suffit, le
# script ne fait aucun appel git. Base indépendante de `.tests_base` (qui
# installerait aussi `git` et `bash` sans besoin) et de `.hygiene_base` (qui
# n'a pas `python3`, et qu'on ne touche pas — voir plus haut).
hygiene:agents-copilot:
  stage: hygiene
  image: alpine:3.20
  before_script:
    - apk add --no-cache python3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 tools/sync_copilot_agents.py --check
