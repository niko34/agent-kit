name: Hygiène du dépôt

# Trois contrôles d'invariant documentaire et d'agents, sans dépendance externe.
#
# JOB 1 — Unicité des specs.
# Un nom de spec ne doit vivre que dans UN seul des dossiers todo/ · doing/ ·
# done/. Le cycle procède par déplacement ; une spec copiée produit deux versions
# qui divergent et deux statuts qui se contredisent.
#
# JOB 2 — Liens de documentation.
# Le chemin d'un lien vers une spec encode son ÉTAT (`doing/`, `done/`) ; chaque
# promotion casse silencieusement les liens qui citaient l'ancien emplacement.
#
# JOB 3 — Profils GitHub Copilot.
# Les agents Claude sont la source de vérité ; leurs profils Copilot versionnés
# doivent être régénérés à chaque évolution pour ne pas dériver silencieusement.
# Le commit qui promeut une spec échoue tout de suite, au lieu de laisser pourrir
# la doc pendant des mois.
#
# Aucun filtre de chemins, aucune toolchain, aucun cache : le contrôle coûte une
# seconde et doit tourner sur TOUS les commits — un déplacement de spec
# n'accompagne pas nécessairement une modification de code. Un contrôle que
# personne ne lance ne rend rien inexprimable.
#
# JOB 4 — Tests (feature-006).
# Job DISTINCT, et non une extension des trois contrôles ci-dessus : mesuré
# le 2026-09-12, `tests/` coûte ~75 ms par cas, deux dépôts git réels créés
# à chaque fois — l'un des quatre lots visés porte à lui seul ~24 cas, donc
# quelques secondes rien que pour ce fichier. Le budget « une seconde, sans
# toolchain ni cache » des trois contrôles d'hygiène ne doit pas absorber
# cette croissance ; en contrepartie, ce job tourne en PARALLÈLE des trois
# autres (même `on:`, même groupe de `concurrency`), donc le temps de
# restitution global ne change pas.
#
# JOB 5 — Tests du centre de contrôle (bug-004, feature-007).
# Même patron que le job 4 : `control-center/` descend chez les projets
# consommateurs, donc le job teste l'EXISTENCE du répertoire avant de lancer
# quoi que ce soit. Différence structurante avec le job 4 : les fichiers ne
# sont PAS des suites `unittest` mais des scripts autonomes qui sortent en
# code 1 à l'échec (`python3 control-center/backend/test_events.py`, pas
# `unittest discover`).
#
# ⚠️ La liste des fichiers est DÉCOUVERTE (`find control-center -name
# 'test_*.py'`), jamais énumérée à la main : une énumération manuelle a déjà
# laissé `control-center/backend/test_agents.py` (24 cas verts) hors CI sans
# qu'aucun signal ne le dise — vérifié en écrivant ce commentaire. La
# découverte ÉCHOUE si elle ne trouve aucun fichier alors que `control-center/`
# existe : une liste vide ne doit jamais se lire comme « tout est vert ».
# Ne pas citer ici de compte de cas : il périme aussitôt.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hygiene-specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unicite:
    name: Unicité des specs (todo · doing · done)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La logique vit dans le dépôt, pas dans ce YAML : le même script tourne en
      # local (`./tools/check_specs.sh`) et peut servir de hook pre-commit.
      - name: Contrôle d'unicité
        run: ./tools/check_specs.sh

  liens-doc:
    name: Liens de documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôle des liens de documentation
        run: ./tools/check_doc_links.sh

  agents-copilot:
    name: Synchronisation des agents GitHub Copilot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôle des profils générés
        run: python3 tools/sync_copilot_agents.py --check

  tests:
    name: Suite de tests (tests/)
    runs-on: ubuntu-latest
    # `contents: read` suffit : ce job ne fait que lire le dépôt et exécuter
    # des tests, jamais écrire (revue de sécurité, feature-006).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Motifs explicites, un par fichier de test DU KIT — jamais une
      # découverte non filtrée. `tests/` est un chemin CONDITIONNEL du kit :
      # un projet consommateur qui l'a déjà reçoit aussi ses propres tests
      # métier dans ce même dossier. `discover -s tests` sans motif les
      # collecterait ici, dans une image qui n'a pas leurs dépendances — nous
      # casserions leur CI par notre faute. Ce job ne teste QUE le kit.
      #
      # ⚠️ Chaque étape vérifie l'EXISTENCE du fichier avant de lancer
      # `unittest` : ce même YAML descend chez un projet consommateur (chemin
      # conditionnel), qui peut avoir exclu tel fichier via `.kit-paths`.
      # Depuis Python 3.12, `unittest discover` sort en code 5 (« aucun test
      # collecté ») quand le motif ne matche rien — un échec, pas un succès.
      # Un projet qui n'a pas nos tests ne doit pas voir sa CI cassée par
      # nous : d'où le test d'existence, plutôt qu'un `|| true` qui aurait
      # aussi masqué un VRAI échec de test.
      - name: Suite de tests du kit (update_kit.sh)
        run: |
          if [ -f tests/test_update_kit.py ]; then
            python3 -m unittest discover -s tests -p 'test_update_kit.py'
          else
            echo "ℹ️  tests/test_update_kit.py absent (exclu via .kit-paths ?) — rien à lancer."
          fi

      - name: Suite de tests du kit (harnais)
        run: |
          if [ -f tests/test_harnais_kit.py ]; then
            python3 -m unittest discover -s tests -p 'test_harnais_kit.py'
          else
            echo "ℹ️  tests/test_harnais_kit.py absent (exclu via .kit-paths ?) — rien à lancer."
          fi

      - name: Suite de tests du kit (profils Copilot)
        run: |
          if [ -f tests/test_sync_copilot_agents.py ]; then
            python3 -m unittest discover -s tests -p 'test_sync_copilot_agents.py'
          else
            echo "ℹ️  tests/test_sync_copilot_agents.py absent (exclu via .kit-paths ?) — rien à lancer."
          fi

  centre-de-controle:
    name: Suite de tests (control-center/)
    runs-on: ubuntu-latest
    # `contents: read` suffit : ce job ne fait que lire le dépôt et exécuter
    # des scripts de test autonomes, jamais écrire.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `control-center/` est un chemin CONDITIONNEL, comme `tests/` : un
      # projet consommateur qui n'a pas encore reçu le centre de contrôle ne
      # doit pas voir sa CI cassée par nous — d'où le test d'existence du
      # RÉPERTOIRE, en premier, avant toute découverte.
      #
      # ⚠️ Ce ne sont PAS des suites `unittest` : chaque fichier est un script
      # AUTONOME qui sort en code 1 à l'échec — d'où un appel direct
      # `python3 <fichier>`, jamais `unittest discover` (qui ne les
      # collecterait pas, ces fichiers ne dérivant d'aucun `TestCase`).
      #
      # ⚠️ La liste est DÉCOUVERTE (`find`), jamais énumérée à la main : une
      # énumération manuelle a déjà laissé `test_agents.py` hors CI sans que
      # rien ne le signale. Si `control-center/` existe mais qu'AUCUN
      # `test_*.py` n'est trouvé, le job ÉCHOUE — une liste vide n'est jamais
      # un succès silencieux.
      #
      # bug-022 — ce job est le job SYSTÈME : il ne filtre AUCUN fichier, y
      # compris les harnais navigateur (`HARNAIS_NAVIGATEUR = True`), à la
      # différence du job `centre-de-controle-matrice` ci-dessous. C'est lui
      # qui garantit qu'un harnais navigateur s'exécute encore au moins une
      # fois — une copie du filtre de la matrice ICI le ferait tomber à ZÉRO
      # exécution, en silence. Gardé par
      # `control-center/backend/test_ci_partition_navigateur.py`.
      #
      # `python3 "$fichier" < /dev/null` isole le `stdin` de chaque script —
      # utile en soi (un test qui lirait `stdin` sans s'y attendre tombe sur
      # /dev/null plutôt que sur un flux hérité imprévisible), et on le
      # garde. ⚠️ CE N'EST PAS la parade PIEGES §48 ICI, contrairement à ce
      # qu'une rédaction antérieure de ce commentaire affirmait (corrigé en
      # revue, bug-022) : §48 décrit un `while read … done < liste.txt` qui
      # PARTAGE son `stdin` avec ce qu'il lance à l'intérieur — CETTE boucle
      # est un `for … in "${fichiers[@]}"` sur un TABLEAU déjà rempli par
      # `mapfile` en amont, donc immunisée PAR CONSTRUCTION contre ce
      # partage (mesuré en revue : un test qui lit `stdin` ici n'en tronque
      # aucun, 3/3 exécutés). La comparaison `exécutés == découverts`
      # ci-dessous est donc, EN L'ÉTAT ACTUEL DU CODE, tautologique — rien
      # dans cette boucle ne peut aujourd'hui sauter un fichier. Elle reste
      # utile comme FIL-PIÈGE : si une future modification y introduit un
      # `continue` ou toute autre sortie anticipée, c'est cette comparaison
      # (et la garde `control-center/backend/
      # test_ci_partition_navigateur.py`, qui exige l'ABSENCE de `continue`
      # ici) qui le détecteraient — pas une protection agissante aujourd'hui.
      - name: Suite de tests du centre de contrôle (découverte)
        run: |
          if [ ! -d control-center ]; then
            echo "ℹ️  control-center/ absent — rien à lancer."
            exit 0
          fi

          mapfile -t fichiers < <(find control-center -type f -name 'test_*.py' | sort)

          if [ "${#fichiers[@]}" -eq 0 ]; then
            echo "❌ control-center/ existe mais aucun fichier test_*.py n'a été découvert." >&2
            echo "   Une liste vide ne doit jamais se lire comme « tout est vert »." >&2
            exit 1
          fi

          echo "Fichiers de test découverts (${#fichiers[@]}) :"
          printf '  - %s\n' "${fichiers[@]}"
          echo

          echec_global=0
          executes=()
          for fichier in "${fichiers[@]}"; do
            echo "=== $fichier ==="
            if ! python3 "$fichier" < /dev/null; then
              echec_global=1
            fi
            executes+=("$fichier")
            echo
          done

          echo "Découverts: ${#fichiers[@]} · Exclus (harnais navigateur): 0 · Exécutés: ${#executes[@]}"

          if [ "${#executes[@]}" -ne "${#fichiers[@]}" ]; then
            echo "❌ ${#fichiers[@]} fichier(s) découvert(s) mais ${#executes[@]} exécuté(s)." >&2
            echo "   La boucle a été interrompue — ne jamais lire ce cas comme un succès." >&2
            exit 1
          fi

          exit "$echec_global"

  centre-de-controle-matrice:
    name: Suite de tests (control-center/) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # `contents: read` suffit, comme le job non épinglé ci-dessus.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Intervalle de Python DÉCLARÉ pour control-center/ (bug-018, ADR-0035).
        #
        # ⚠️ Plancher **3.11**, MESURÉ et non supposé. `control-center/backend/
        # config.py` et `control-center/installer.py` importent `tomllib`, entré
        # dans la bibliothèque standard en 3.11. `installer.py` le déclare déjà
        # en clair : « il en faut 3.11 ou plus (tomllib) ».
        #
        # ⚠️ Ce job N'EST PAS la seule source de cette borne — `installer.py` en
        # est une seconde, et elle est exécutable. Les deux doivent bouger
        # ensemble ; une rédaction antérieure de ce commentaire affirmait le
        # contraire, ce qui aurait laissé les deux diverger en silence
        # (PIEGES §21).
        #
        # ⚠️ Une première rédaction déclarait **3.9**. Mesuré pendant la revue de
        # bug-018, en émulant l'absence de `tomllib` : cette borne INTERROMPAIT
        # `test_config.py` et `test_server_ecriture.py`, et faisait échouer
        # `test_server.py` et `test_server_bug012.py`. Le job serait donc parti
        # ROUGE dans le lot même dont le critère non substituable est « la CI est
        # verte » — un plancher déclaré sans être exécuté n'est pas une mesure.
        #
        # Si la matrice devient rouge à la borne basse, remonter le plancher à la
        # première borne VERTE mesurée — jamais l'inverse, et jamais sans
        # relancer. Plafond 3.13 : dernière version disponible sur ce cycle.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Même script que le job `centre-de-controle` non épinglé ci-dessus —
      # ce job-ci ne change QUE la version de Python, jamais la découverte ni
      # la façon de lancer les suites (§6 : scripts autonomes, jamais
      # `unittest discover`).
      #
      # bug-022 — ce job N'EST PAS le job système : ce que la matrice vérifie,
      # c'est le comportement du PYTHON (3.11 · 3.13), pas le rendu d'une page
      # dans Chromium. Exécuter un harnais navigateur trois fois (ici + le job
      # système) ne prouve rien de plus qu'une fois, et coûte l'exposition
      # (bug-022 RECTIFICATION : 3 occasions indépendantes de croiser une VM
      # lente au lieu d'1) qui a fait échouer deux jobs sur le même commit
      # sans changement de code. On EXCLUT donc tout fichier qui se déclare
      # `HARNAIS_NAVIGATEUR = True` — le job système, lui, ne filtre RIEN et
      # continue de les exécuter (une fois chacun). Gardé par
      # `control-center/backend/test_ci_partition_navigateur.py`, qui exige
      # ce filtre présent ICI et absent côté job système.
      - name: Suite de tests du centre de contrôle (découverte)
        run: |
          if [ ! -d control-center ]; then
            echo "ℹ️  control-center/ absent — rien à lancer."
            exit 0
          fi

          mapfile -t fichiers < <(find control-center -type f -name 'test_*.py' | sort)

          if [ "${#fichiers[@]}" -eq 0 ]; then
            echo "❌ control-center/ existe mais aucun fichier test_*.py n'a été découvert." >&2
            echo "   Une liste vide ne doit jamais se lire comme « tout est vert »." >&2
            exit 1
          fi

          echo "Fichiers de test découverts (${#fichiers[@]}) :"
          printf '  - %s\n' "${fichiers[@]}"
          echo

          echec_global=0
          exclus=()
          executes=()
          for fichier in "${fichiers[@]}"; do
            # bug-022 : motif de filtrage — un harnais navigateur porte la
            # ligne de module EXACTE `HARNAIS_NAVIGATEUR = True`. Le job
            # système (ci-dessus) ne porte pas ce test.
            if grep -qx 'HARNAIS_NAVIGATEUR = True' "$fichier"; then
              exclus+=("$fichier")
              echo "=== $fichier === EXCLU (harnais navigateur, bug-022)"
              echo
              continue
            fi
            echo "=== $fichier ==="
            if ! python3 "$fichier" < /dev/null; then
              echec_global=1
            fi
            executes+=("$fichier")
            echo
          done

          echo "Découverts: ${#fichiers[@]} · Exclus (harnais navigateur): ${#exclus[@]} · Exécutés: ${#executes[@]}"

          attendu=$(( ${#fichiers[@]} - ${#exclus[@]} ))
          if [ "${#executes[@]}" -ne "$attendu" ]; then
            echo "❌ ${#fichiers[@]} découvert(s), ${#exclus[@]} exclu(s), mais ${#executes[@]} exécuté(s) (attendu $attendu)." >&2
            echo "   La boucle a été interrompue — ne jamais lire ce cas comme un succès." >&2
            exit 1
          fi

          exit "$echec_global"
