name: Hygiène du dépôt

# Trois contrôles d'invariant documentaire et d'agents, sans dépendance externe.
#
# JOB 1 — Unicité des specs.
# Un nom de spec ne doit vivre que dans UN seul des dossiers todo/ · doing/ ·
# done/. Le cycle procède par déplacement ; une spec copiée produit deux versions
# qui divergent et deux statuts qui se contredisent.
#
# JOB 2 — Liens de documentation.
# Le chemin d'un lien vers une spec encode son ÉTAT (`doing/`, `done/`) ; chaque
# promotion casse silencieusement les liens qui citaient l'ancien emplacement.
#
# JOB 3 — Profils GitHub Copilot.
# Les agents Claude sont la source de vérité ; leurs profils Copilot versionnés
# doivent être régénérés à chaque évolution pour ne pas dériver silencieusement.
# Le commit qui promeut une spec échoue tout de suite, au lieu de laisser pourrir
# la doc pendant des mois.
#
# Aucun filtre de chemins, aucune toolchain, aucun cache : le contrôle coûte une
# seconde et doit tourner sur TOUS les commits — un déplacement de spec
# n'accompagne pas nécessairement une modification de code. Un contrôle que
# personne ne lance ne rend rien inexprimable.
#
# JOB 4 — Tests (feature-006).
# Job DISTINCT, et non une extension des trois contrôles ci-dessus : mesuré
# le 2026-09-12, `tests/` coûte ~75 ms par cas, deux dépôts git réels créés
# à chaque fois — l'un des quatre lots visés porte à lui seul ~24 cas, donc
# quelques secondes rien que pour ce fichier. Le budget « une seconde, sans
# toolchain ni cache » des trois contrôles d'hygiène ne doit pas absorber
# cette croissance ; en contrepartie, ce job tourne en PARALLÈLE des trois
# autres (même `on:`, même groupe de `concurrency`), donc le temps de
# restitution global ne change pas.
#
# JOB 5 — Tests du centre de contrôle (bug-004).
# Même patron que le job 4 : `control-center/` descend chez les projets
# consommateurs, donc chaque étape teste l'EXISTENCE du fichier avant de le
# lancer. Différence structurante avec le job 4 : les six fichiers ne sont
# PAS des suites `unittest` mais des scripts autonomes qui sortent en code 1
# à l'échec (`python3 control-center/backend/test_events.py`, pas
# `unittest discover`). Ne pas citer ici de compte de cas : il périme aussitôt.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hygiene-specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unicite:
    name: Unicité des specs (todo · doing · done)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La logique vit dans le dépôt, pas dans ce YAML : le même script tourne en
      # local (`./tools/check_specs.sh`) et peut servir de hook pre-commit.
      - name: Contrôle d'unicité
        run: ./tools/check_specs.sh

  liens-doc:
    name: Liens de documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôle des liens de documentation
        run: ./tools/check_doc_links.sh

  agents-copilot:
    name: Synchronisation des agents GitHub Copilot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôle des profils générés
        run: python3 tools/sync_copilot_agents.py --check

  tests:
    name: Suite de tests (tests/)
    runs-on: ubuntu-latest
    # `contents: read` suffit : ce job ne fait que lire le dépôt et exécuter
    # des tests, jamais écrire (revue de sécurité, feature-006).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Motifs explicites, un par fichier de test DU KIT — jamais une
      # découverte non filtrée. `tests/` est un chemin CONDITIONNEL du kit :
      # un projet consommateur qui l'a déjà reçoit aussi ses propres tests
      # métier dans ce même dossier. `discover -s tests` sans motif les
      # collecterait ici, dans une image qui n'a pas leurs dépendances — nous
      # casserions leur CI par notre faute. Ce job ne teste QUE le kit.
      #
      # ⚠️ Chaque étape vérifie l'EXISTENCE du fichier avant de lancer
      # `unittest` : ce même YAML descend chez un projet consommateur (chemin
      # conditionnel), qui peut avoir exclu tel fichier via `.kit-paths`.
      # Depuis Python 3.12, `unittest discover` sort en code 5 (« aucun test
      # collecté ») quand le motif ne matche rien — un échec, pas un succès.
      # Un projet qui n'a pas nos tests ne doit pas voir sa CI cassée par
      # nous : d'où le test d'existence, plutôt qu'un `|| true` qui aurait
      # aussi masqué un VRAI échec de test.
      - name: Suite de tests du kit (update_kit.sh)
        run: |
          if [ -f tests/test_update_kit.py ]; then
            python3 -m unittest discover -s tests -p 'test_update_kit.py'
          else
            echo "ℹ️  tests/test_update_kit.py absent (exclu via .kit-paths ?) — rien à lancer."
          fi

      - name: Suite de tests du kit (harnais)
        run: |
          if [ -f tests/test_harnais_kit.py ]; then
            python3 -m unittest discover -s tests -p 'test_harnais_kit.py'
          else
            echo "ℹ️  tests/test_harnais_kit.py absent (exclu via .kit-paths ?) — rien à lancer."
          fi

      - name: Suite de tests du kit (profils Copilot)
        run: |
          if [ -f tests/test_sync_copilot_agents.py ]; then
            python3 -m unittest discover -s tests -p 'test_sync_copilot_agents.py'
          else
            echo "ℹ️  tests/test_sync_copilot_agents.py absent (exclu via .kit-paths ?) — rien à lancer."
          fi

  centre-de-controle:
    name: Suite de tests (control-center/)
    runs-on: ubuntu-latest
    # `contents: read` suffit : ce job ne fait que lire le dépôt et exécuter
    # des scripts de test autonomes, jamais écrire.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `control-center/` est un chemin CONDITIONNEL, comme `tests/` : un
      # projet consommateur qui n'a pas encore reçu le centre de contrôle ne
      # doit pas voir sa CI cassée par nous. Même patron que le job `tests`
      # ci-dessus : un test d'EXISTENCE par fichier, `if/then/else` explicite,
      # jamais un `|| true` qui masquerait aussi un VRAI échec.
      #
      # ⚠️ Ce ne sont PAS des suites `unittest` : chaque fichier est un
      # script AUTONOME qui sort en code 1 à l'échec — d'où un appel direct
      # `python3 <fichier>`, jamais `unittest discover` (qui ne les
      # collecterait pas, ces fichiers ne dérivant d'aucun `TestCase`).
      - name: Suite de tests du centre de contrôle (hooks)
        run: |
          if [ -f control-center/hooks/test_record_event.py ]; then
            python3 control-center/hooks/test_record_event.py
          else
            echo "ℹ️  control-center/hooks/test_record_event.py absent — rien à lancer."
          fi

      - name: Suite de tests du centre de contrôle (specs)
        run: |
          if [ -f control-center/backend/test_specs.py ]; then
            python3 control-center/backend/test_specs.py
          else
            echo "ℹ️  control-center/backend/test_specs.py absent — rien à lancer."
          fi

      - name: Suite de tests du centre de contrôle (événements)
        run: |
          if [ -f control-center/backend/test_events.py ]; then
            python3 control-center/backend/test_events.py
          else
            echo "ℹ️  control-center/backend/test_events.py absent — rien à lancer."
          fi

      - name: Suite de tests du centre de contrôle (configuration)
        run: |
          if [ -f control-center/backend/test_config.py ]; then
            python3 control-center/backend/test_config.py
          else
            echo "ℹ️  control-center/backend/test_config.py absent — rien à lancer."
          fi

      - name: Suite de tests du centre de contrôle (vcs)
        run: |
          if [ -f control-center/backend/test_vcs.py ]; then
            python3 control-center/backend/test_vcs.py
          else
            echo "ℹ️  control-center/backend/test_vcs.py absent — rien à lancer."
          fi

      - name: Suite de tests du centre de contrôle (serveur)
        run: |
          if [ -f control-center/backend/test_server.py ]; then
            python3 control-center/backend/test_server.py
          else
            echo "ℹ️  control-center/backend/test_server.py absent — rien à lancer."
          fi
